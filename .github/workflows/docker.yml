name: docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Audits the workflows themselves. `advanced-security: false` makes this fail
  # the run on findings; the default instead files them as code scanning alerts
  # and reports success, which would not gate anything.
  zizmor:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          version: v1.30.0
          advanced-security: false
          annotations: true

  # `bun test` runs the store contracts against every implementation, and the
  # Valkey suites are skipped unless TRINOCULAR_TEST_VALKEY names a server, so
  # without the service here a third of the suite would silently not run. The
  # Dockerfile's builder stage runs `check` and `build`, and neither of these.
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6379:6379

    env:
      TRINOCULAR_TEST_VALKEY: localhost:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - run: bun run test

      - run: bun run format:check

  build:
    needs: [zizmor, test]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # The default image is the debian-slim one; the distroless variant is
          # tagged for what it is. The distroless image used to publish under
          # `-slim`, which named the *other* image's base.
          - target: runtime
            suffix: ""
          - target: distroless
            suffix: "-distroless"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Packages
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # MAJOR.MINOR from package.json and this workflow's run number: increasing
      # with no history to count, so the checkout stays shallow. Pull request
      # runs take numbers too, so main's have gaps.
      - name: Name the build
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          series=$(jq -r .version package.json | cut -d. -f1,2)
          echo "series=$series" >> "$GITHUB_OUTPUT"
          echo "version=$series.$RUN_NUMBER" >> "$GITHUB_OUTPUT"

      # Labels sit in the image config; annotations on the manifest and the
      # index are what a registry shows, so both are written.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=true
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},priority=1000
            type=raw,value=${{ steps.version.outputs.series }}
            type=raw,value=${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          annotations: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            TRINOCULAR_VERSION=${{ steps.version.outputs.version }}
            TRINOCULAR_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
